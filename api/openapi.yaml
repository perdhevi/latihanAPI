          type: "array"
          items:
            "$ref": "#/components/schemas/ExerciseComparison"
      description: "Uses the session's saved plan version. All deltas are actual minus planned. Planned entries come first in plan order; unplanned entries follow in session order. Sets are compared by ordinal position. Missing records are null, not invented measurements. Matched means linked, not that the target was met. BPM is not aggregated across exercises."
    Error:
      type: "object"
      additionalProperties: false
      required:
        - "error"
      properties:
        error:
          type: "object"
          additionalProperties: false
          required:
            - "code"
            - "message"
          properties:
            code:
              type: "string"
              enum:
                - "invalid_request"
                - "invalid_id"
                - "validation_failed"
                - "invalid_reference"
                - "resource_in_use"
                - "user_not_found"
                - "measurement_not_found"
                - "plan_not_found"
                - "session_not_found"
                - "comparison_not_found"
                - "not_found"
                - "method_not_allowed"
                - "not_ready"
                - "internal_error"
            message:
              type: "string"
    Health:
      type: "object"
      additionalProperties: false
      required:
        - "status"
      properties:
        status:
          type: "string"
          enum:
            - "ok"
