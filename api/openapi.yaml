openapi: "3.0.3"
info:
  title: "latihanApi"
  version: "0.3.0"
  description: "Personal sessions, plans, profiles and measurement history. /exercises has been removed. Every /api/v1 operation requires a bearer token from the configured provider. POST /api/v1/users links the caller's identity to a new profile; other operations require that profile. Ownership of user_id values is not yet enforced (phase 4). All responses include X-Request-ID. Input bodies are limited to 1 MiB; unknown JSON fields, unknown/repeated query parameters and multiple JSON values are rejected. Strings are trimmed. PUT fully replaces editable fields; no upserts. UUIDs and creation timestamps are server-managed. HTTP method errors use the same Error schema."
servers:
  -
    url: "http://localhost:8080"
security:
  - bearerAuth: []
tags:
  -
    name: "Health"
  -
    name: "Sessions"
  -
    name: "Plans"
  -
    name: "Users"
  -
    name: "Measurements"
paths:
  "/health":
    get:
      operationId: "health"
      security: []
      tags:
        - "Health"
      summary: "Liveness independent of database availability"
      responses:
        "200":
          description: "Healthy"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Health"
  "/ready":
    get:
      operationId: "ready"
      security: []
      tags:
        - "Health"
      summary: "PostgreSQL connectivity with a two-second deadline"
      responses:
        "200":
          description: "Ready"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Health"
        "503":
          description: "Database unavailable"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/sessions":
    post:
      operationId: "createSession"
      tags:
        - "Sessions"
      summary: "Create session"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/SessionInput"
      responses:
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/ProfileRequired"
        "503":
          "$ref": "#/components/responses/AuthUnavailable"
        "201":
          description: "Created"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Session"
          headers:
            Location:
              schema:
                type: "string"
              description: "Relative URL of the created resource"
        "400":
          description: "Invalid JSON, UUID, input, query, owner or plan reference."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "413":
          description: "Body exceeds 1 MiB."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "415":
          description: "Content-Type must be application/json."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "500":
          description: "Unexpected error; internal details are not exposed."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
    get:
      operationId: "listSessions"
      tags:
        - "Sessions"
      summary: "List sessions"
      description: "Required user_id filter. Newest performed_at first, then id DESC. No matches returns an empty items array."
      parameters:
        -
          name: "user_id"
          in: "query"
          required: true
          schema:
            type: "string"
            format: "uuid"
            description: "Nonzero UUID"
        -
          name: "limit"
          in: "query"
          schema:
            type: "integer"
            minimum: 1
            maximum: 100
            default: 20
        -
          name: "offset"
          in: "query"
          schema:
            type: "integer"
            minimum: 0
            maximum: 2147483647
            default: 0
      responses:
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/ProfileRequired"
        "503":
          "$ref": "#/components/responses/AuthUnavailable"
        "200":
          description: "Page"
          content:
            "application/json":
              schema:
                type: "object"
                additionalProperties: false
                required:
                  - "items"
                  - "limit"
                  - "offset"
                properties:
                  items:
                    type: "array"
                    items:
                      "$ref": "#/components/schemas/Session"
                  limit:
                    type: "integer"
                  offset:
                    type: "integer"
        "400":
          description: "Invalid JSON, UUID, input, query, owner or plan reference."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "500":
          description: "Unexpected error; internal details are not exposed."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
