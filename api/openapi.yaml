components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "Token from the configured AUTH_PROVIDER (Firebase ID token, Cognito access or ID token, or OIDC access token)."
  responses:
    Unauthorized:
      description: "Missing or invalid bearer token. WWW-Authenticate describes the challenge."
      headers:
        WWW-Authenticate:
          schema:
            type: "string"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    ProfileRequired:
      description: "Authenticated, but the identity has no profile yet. Create one with POST /api/v1/users."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    AuthUnavailable:
      description: "The authentication provider could not verify the token, for example because its key server is unreachable."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
  schemas:
    Set:
      type: "object"
      additionalProperties: false
      required:
        - "repetitions"
        - "weight_kg"
      properties:
        repetitions:
          type: "integer"
          minimum: 1
          maximum: 1000
        weight_kg:
          type: "number"
          minimum: 0
          maximum: 2000
    ExerciseInput:
      type: "object"
      additionalProperties: false
      required:
        - "name"
        - "kind"
      properties:
        name:
          type: "string"
          maxLength: 200
          minLength: 1
        kind:
          type: "string"
          enum:
            - "strength"
            - "cardio"
        sets:
          type: "array"
          items:
            "$ref": "#/components/schemas/Set"
          maxItems: 100
          nullable: true
        minutes:
          type: "number"
          exclusiveMinimum: true
          minimum: 0
          maximum: 1440
          nullable: true
        avg_bpm:
          type: "integer"
          minimum: 1
          maximum: 300
          nullable: true
      description: "Names are trimmed, kind is lowercased. Strength requires 1..100 sets with explicit weight_kg (0 for bodyweight), and no non-null cardio metrics. Cardio requires minutes and no sets; avg_bpm is optional. Exercise order and set order are preserved."
      oneOf:
        -
          properties:
            kind:
              enum:
                - "strength"
            sets:
              type: "array"
              minItems: 1
              maxItems: 100
              items:
                "$ref": "#/components/schemas/Set"
            minutes:
              nullable: true
              enum:
                - null
            avg_bpm:
              nullable: true
              enum:
                - null
          required:
            - "sets"
        -
          properties:
            kind:
              enum:
                - "cardio"
            sets:
              type: "array"
              nullable: true
              maxItems: 0
            minutes:
              type: "number"
              minimum: 0
              exclusiveMinimum: true
              maximum: 1440
          required:
            - "minutes"
    PlanExercise:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "name"
        - "kind"
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "Nonzero UUID"
        name:
          type: "string"
          maxLength: 200
          minLength: 1
        kind:
          type: "string"
