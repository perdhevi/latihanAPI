openapi: "3.0.3"
info:
  title: "latihanApi"
  version: "0.7.0"
  description: "Personal sessions, plans, profiles and measurement history. /exercises has been removed. Single-record responses carry an ETag; PUT and DELETE accept If-Match for optimistic concurrency. Creating POSTs accept Idempotency-Key for safe retries. Lists use cursor pagination (limit, cursor, next_cursor). Requests are rate limited per client address, per account, and more strictly on /api/v1/auth; limited requests get 429 with Retry-After. Every /api/v1 operation except /api/v1/auth/* requires a bearer token from the configured provider. The /api/v1/auth endpoints and /.well-known/jwks.json exist only with the built-in jwt provider. POST /api/v1/users links the caller's identity to a new profile; other operations require that profile. Callers only ever see and change their own records: owners come from the token, never from input, and other users' records return 404. All responses include X-Request-ID. Input bodies are limited to 1 MiB; unknown JSON fields, unknown/repeated query parameters and multiple JSON values are rejected. Strings are trimmed. PUT fully replaces editable fields; no upserts. UUIDs and creation timestamps are server-managed. HTTP method errors use the same Error schema."
servers:
  -
    url: "http://localhost:8080"
security:
  - bearerAuth: []
tags:
  -
    name: "Health"
  -
    name: "Auth"
  -
    name: "Sessions"
  -
    name: "Plans"
  -
    name: "Users"
  -
    name: "Measurements"
paths:
  "/health":
    get:
      operationId: "health"
      security: []
      tags:
        - "Health"
      summary: "Liveness independent of database availability"
      responses:
        "200":
          description: "Healthy"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Health"
  "/ready":
    get:
      operationId: "ready"
      security: []
      tags:
        - "Health"
      summary: "PostgreSQL connectivity with a two-second deadline"
      responses:
        "200":
          description: "Ready"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Health"
        "503":
          description: "Database unavailable"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/sessions":
    post:
      operationId: "createSession"
      tags:
        - "Sessions"
      summary: "Create session"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/SessionInput"
      parameters:
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      responses:
        "409":
          "$ref": "#/components/responses/IdempotencyInProgress"
        "422":
          "$ref": "#/components/responses/IdempotencyKeyReused"
        "429":
          "$ref": "#/components/responses/RateLimited"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/ProfileRequired"
        "503":
          "$ref": "#/components/responses/ServiceUnavailable"
        "201":
          description: "Created"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Session"
          headers:
            Location:
              schema:
                type: "string"
              description: "Relative URL of the created resource"
        "400":
          description: "Invalid JSON, UUID, input, query, owner or plan reference."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "413":
          description: "Body exceeds 1 MiB."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "415":
          description: "Content-Type must be application/json."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "500":
          description: "Unexpected error; internal details are not exposed."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
    get:
      operationId: "listSessions"
      tags:
        - "Sessions"
      summary: "List sessions"
      description: "The caller's sessions, newest performed_at first, then id DESC. No matches returns an empty items array. user_id is not accepted."
      parameters:
        -
          name: "limit"
          in: "query"
          schema:
            type: "integer"
            minimum: 1
            maximum: 100
            default: 20
        -
          name: "cursor"
          in: "query"
          description: "next_cursor from the previous page; omit for the first page. Opaque."
          schema:
            type: "string"
            maxLength: 128
      responses:
        "429":
          "$ref": "#/components/responses/RateLimited"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/ProfileRequired"
        "503":
          "$ref": "#/components/responses/ServiceUnavailable"
        "200":
          description: "Page"
          content:
            "application/json":
              schema:
                type: "object"
                additionalProperties: false
                required:
                  - "items"
                  - "limit"
                  - "next_cursor"
                properties:
                  items:
                    type: "array"
                    items:
                      "$ref": "#/components/schemas/Session"
                  limit:
                    type: "integer"
                  next_cursor:
                    type: "string"
                    nullable: true
                    description: "Pass as cursor to get the next page; null on the last page."
        "400":
          description: "Invalid JSON, UUID, input, query, owner or plan reference."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "500":
          description: "Unexpected error; internal details are not exposed."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
