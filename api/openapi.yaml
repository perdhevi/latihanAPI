    PlanInput:
      type: "object"
      additionalProperties: false
      required:
        - "name"
        - "exercises"
      properties:
        name:
          type: "string"
          maxLength: 200
          minLength: 1
        notes:
          type: "string"
          maxLength: 4000
          nullable: true
          default: ""
        exercises:
          type: "array"
          minItems: 1
          maxItems: 100
          items:
            "$ref": "#/components/schemas/ExerciseInput"
      description: "Full replacement. Owner cannot change. Every write generates new exercise entry IDs. Existing session snapshots remain unchanged."
    Plan:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "user_id"
        - "name"
        - "notes"
        - "exercises"
        - "created_at"
        - "updated_at"
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "Nonzero UUID"
        user_id:
          type: "string"
          format: "uuid"
          description: "Nonzero UUID"
        name:
          type: "string"
          maxLength: 200
          minLength: 1
        notes:
          type: "string"
          maxLength: 4000
        exercises:
          type: "array"
          minItems: 1
          maxItems: 100
          items:
            "$ref": "#/components/schemas/PlanExercise"
        created_at:
          type: "string"
          format: "date-time"
        updated_at:
          type: "string"
          format: "date-time"
    SessionInput:
      type: "object"
      additionalProperties: false
      required:
        - "name"
        - "performed_at"
        - "exercises"
      properties:
        name:
          type: "string"
          maxLength: 200
          minLength: 1
        notes:
          type: "string"
          maxLength: 4000
          nullable: true
          default: ""
        performed_at:
          type: "string"
          format: "date-time"
        plan_id:
          type: "string"
          format: "uuid"
          description: "Nonzero UUID"
          nullable: true
        exercises:
          type: "array"
          minItems: 1
          maxItems: 100
          items:
            "$ref": "#/components/schemas/SessionExercise"
      description: "Full replacement. The owner is always the caller and is not part of the input. Optional plan_id must be one of the caller's plans. plan_exercise_id links each actual entry to an entry in its saved plan snapshot and must not repeat. Omitted plan_exercise_id means unplanned. Keeping the same plan_id retains the original snapshot; changing/reattaching captures the current plan; null/omitted plan_id detaches. Times are nonzero RFC3339."
    Session:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "user_id"
        - "name"
        - "notes"
        - "performed_at"
        - "plan_id"
        - "exercises"
        - "plan_snapshot"
        - "created_at"
        - "updated_at"
      properties:
        id:
          type: "string"
          format: "uuid"
          description: "Nonzero UUID"
        user_id:
          type: "string"
          format: "uuid"
          description: "Nonzero UUID"
        name:
          type: "string"
          maxLength: 200
          minLength: 1
        notes:
          type: "string"
          maxLength: 4000
        performed_at:
          type: "string"
          format: "date-time"
        plan_id:
          type: "string"
          format: "uuid"
          description: "Nonzero UUID"
          nullable: true
        exercises:
          type: "array"
          minItems: 1
          maxItems: 100
          items:
            "$ref": "#/components/schemas/SessionExercise"
        plan_snapshot:
          type: "object"
          additionalProperties: false
          required:
            - "id"
            - "user_id"
            - "name"
            - "notes"
            - "exercises"
            - "created_at"
            - "updated_at"
          properties:
            id:
              type: "string"
              format: "uuid"
              description: "Nonzero UUID"
            user_id:
              type: "string"
              format: "uuid"
              description: "Nonzero UUID"
            name:
              type: "string"
              maxLength: 200
              minLength: 1
            notes:
              type: "string"
              maxLength: 4000
            exercises:
              type: "array"
              minItems: 1
              maxItems: 100
              items:
                "$ref": "#/components/schemas/PlanExercise"
            created_at:
              type: "string"
              format: "date-time"
            updated_at:
              type: "string"
              format: "date-time"
          nullable: true
        created_at:
          type: "string"
          format: "date-time"
        updated_at:
          type: "string"
          format: "date-time"
    Totals:
      type: "object"
      additionalProperties: false
      required:
        - "sets"
        - "repetitions"
        - "volume_kg"
        - "minutes"
      properties:
        sets:
          type: "integer"
        repetitions:
          type: "integer"
        volume_kg:
          type: "number"
          description: "Sum of repetitions times weight_kg across all sets."
        minutes:
          type: "number"
    SetComparison:
      type: "object"
      additionalProperties: false
      required:
        - "number"
        - "planned"
        - "actual"
        - "repetitions_delta"
        - "weight_kg_delta"
      properties:
        number:
          type: "integer"
          minimum: 1
        planned:
          type: "object"
          additionalProperties: false
          required:
            - "repetitions"
            - "weight_kg"
          properties:
            repetitions:
              type: "integer"
              minimum: 1
              maximum: 1000
            weight_kg:
              type: "number"
              minimum: 0
              maximum: 2000
          nullable: true
        actual:
          type: "object"
          additionalProperties: false
          required:
            - "repetitions"
            - "weight_kg"
          properties:
            repetitions:
              type: "integer"
              minimum: 1
              maximum: 1000
            weight_kg:
              type: "number"
              minimum: 0
              maximum: 2000
          nullable: true
        repetitions_delta:
          type: "integer"
          nullable: true
        weight_kg_delta:
          type: "number"
          nullable: true
    ExerciseComparison:
      type: "object"
      additionalProperties: false
      required:
        - "plan_exercise_id"
        - "status"
        - "planned"
        - "actual"
        - "planned_totals"
        - "actual_totals"
        - "delta"
        - "avg_bpm_delta"
        - "sets"
      properties:
        plan_exercise_id:
          type: "string"
          format: "uuid"
          description: "Nonzero UUID"
          nullable: true
        status:
          type: "string"
          enum:
            - "matched"
            - "missed"
            - "unplanned"
        planned:
          type: "object"
          additionalProperties: false
          required:
            - "name"
            - "kind"
          properties:
            name:
              type: "string"
              maxLength: 200
              minLength: 1
            kind:
              type: "string"
              enum:
                - "strength"
                - "cardio"
            sets:
              type: "array"
              items:
                "$ref": "#/components/schemas/Set"
              maxItems: 100
              nullable: true
            minutes:
              type: "number"
              exclusiveMinimum: true
              minimum: 0
              maximum: 1440
              nullable: true
            avg_bpm:
              type: "integer"
              minimum: 1
              maximum: 300
              nullable: true
          description: "Names are trimmed, kind is lowercased. Strength requires 1..100 sets with explicit weight_kg (0 for bodyweight), and no non-null cardio metrics. Cardio requires minutes and no sets; avg_bpm is optional. Exercise order and set order are preserved."
          nullable: true
        actual:
          type: "object"
          additionalProperties: false
          required:
            - "name"
            - "kind"
          properties:
            name:
              type: "string"
              maxLength: 200
              minLength: 1
            kind:
              type: "string"
              enum:
                - "strength"
                - "cardio"
            sets:
              type: "array"
              items:
                "$ref": "#/components/schemas/Set"
              maxItems: 100
              nullable: true
            minutes:
              type: "number"
              exclusiveMinimum: true
              minimum: 0
              maximum: 1440
              nullable: true
            avg_bpm:
              type: "integer"
              minimum: 1
              maximum: 300
              nullable: true
          description: "Names are trimmed, kind is lowercased. Strength requires 1..100 sets with explicit weight_kg (0 for bodyweight), and no non-null cardio metrics. Cardio requires minutes and no sets; avg_bpm is optional. Exercise order and set order are preserved."
          nullable: true
        planned_totals:
          "$ref": "#/components/schemas/Totals"
        actual_totals:
          "$ref": "#/components/schemas/Totals"
        delta:
          "$ref": "#/components/schemas/Totals"
        avg_bpm_delta:
          type: "integer"
          nullable: true
          description: "Actual minus planned; null when either BPM is unknown."
        sets:
          type: "array"
          items:
            "$ref": "#/components/schemas/SetComparison"
    Comparison:
      type: "object"
      additionalProperties: false
      required:
        - "plan_id"
        - "session_id"
        - "user_id"
        - "plan_updated_at"
        - "planned_totals"
        - "actual_totals"
        - "delta"
        - "exercises"
      properties:
        plan_id:
          type: "string"
          format: "uuid"
          description: "Nonzero UUID"
        session_id:
          type: "string"
          format: "uuid"
          description: "Nonzero UUID"
        user_id:
          type: "string"
          format: "uuid"
          description: "Nonzero UUID"
        plan_updated_at:
          type: "string"
          format: "date-time"
        planned_totals:
          "$ref": "#/components/schemas/Totals"
        actual_totals:
          "$ref": "#/components/schemas/Totals"
        delta:
          "$ref": "#/components/schemas/Totals"
        exercises:
          type: "array"
          items:
            "$ref": "#/components/schemas/ExerciseComparison"
      description: "Uses the session's saved plan version. All deltas are actual minus planned. Planned entries come first in plan order; unplanned entries follow in session order. Sets are compared by ordinal position. Missing records are null, not invented measurements. Matched means linked, not that the target was met. BPM is not aggregated across exercises."
    Error:
      type: "object"
      additionalProperties: false
      required:
        - "error"
      properties:
        error:
          type: "object"
          additionalProperties: false
          required:
            - "code"
            - "message"
          properties:
            code:
              type: "string"
              enum:
                - "invalid_request"
                - "invalid_id"
                - "validation_failed"
                - "invalid_reference"
                - "resource_in_use"
                - "user_not_found"
                - "measurement_not_found"
                - "plan_not_found"
                - "session_not_found"
                - "comparison_not_found"
                - "not_found"
                - "method_not_allowed"
                - "not_ready"
                - "internal_error"
            message:
              type: "string"
    Health:
      type: "object"
      additionalProperties: false
      required:
        - "status"
      properties:
        status:
          type: "string"
          enum:
            - "ok"
