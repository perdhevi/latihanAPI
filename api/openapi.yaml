  "/api/v1/auth/register":
    post:
      operationId: "register"
      tags:
        - "Auth"
      summary: "Create a built-in account (AUTH_PROVIDER=jwt only)"
      description: "Returns tokens for the new account. Create the profile afterwards with POST /api/v1/users."
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/Credentials"
      responses:
        "429":
          "$ref": "#/components/responses/RateLimited"
        "201":
          "$ref": "#/components/responses/Tokens"
        "400":
          description: "Invalid email, password length or body."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "409":
          description: "An account with this email already exists."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/auth/login":
    post:
      operationId: "login"
      tags:
        - "Auth"
      summary: "Exchange email and password for tokens (AUTH_PROVIDER=jwt only)"
      description: "Unknown emails, wrong passwords and locked accounts get the same 401. Five consecutive failures lock the account for 15 minutes."
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/Credentials"
      responses:
        "429":
          "$ref": "#/components/responses/RateLimited"
        "200":
          "$ref": "#/components/responses/Tokens"
        "401":
          description: "invalid_credentials"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/auth/refresh":
    post:
      operationId: "refresh"
      tags:
        - "Auth"
      summary: "Rotate a refresh token (AUTH_PROVIDER=jwt only)"
      description: "Each refresh token works once. Presenting a used one revokes every token of that session."
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/RefreshRequest"
      responses:
        "429":
          "$ref": "#/components/responses/RateLimited"
        "200":
          "$ref": "#/components/responses/Tokens"
        "401":
          description: "invalid_refresh_token: unknown, expired, revoked or reused."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/auth/logout":
    post:
      operationId: "logout"
      tags:
        - "Auth"
      summary: "Revoke a session's refresh tokens (AUTH_PROVIDER=jwt only)"
      description: "Always 204. Access tokens already issued stay valid until they expire."
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/RefreshRequest"
      responses:
        "429":
          "$ref": "#/components/responses/RateLimited"
        "204":
          description: "Revoked, or nothing to revoke"
  "/.well-known/jwks.json":
    get:
      operationId: "jwks"
      tags:
        - "Auth"
      summary: "Public keys that verify this service's access tokens (AUTH_PROVIDER=jwt only)"
      security: []
      responses:
        "429":
          "$ref": "#/components/responses/RateLimited"
        "200":
          description: "JSON Web Key Set"
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "keys"
                properties:
                  keys:
                    type: "array"
                    items:
                      type: "object"
components:
  parameters:
    IdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: false
      description: "Client-generated key (1..255 visible ASCII), unique per intended action. Retries with the same key and body within 24 hours replay the first response with Idempotent-Replayed: true instead of creating another record. 5xx and 429 responses are not stored."
      schema:
        type: "string"
        maxLength: 255
    IfMatch:
      name: "If-Match"
      in: "header"
      required: false
      description: "ETag from the last read. The write applies only if the record is still at that version; otherwise 412. Optional unless the service sets REQUIRE_IF_MATCH."
      schema:
        type: "string"
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "Token from the configured AUTH_PROVIDER (Firebase ID token, Cognito access or ID token, or OIDC access token)."
  responses:
    PreconditionFailed:
      description: "precondition_failed: the record changed since the ETag in If-Match was read. Fetch it again and retry."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    PreconditionRequired:
      description: "precondition_required: If-Match is mandatory on this deployment (REQUIRE_IF_MATCH=true)."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    IdempotencyInProgress:
      description: "idempotency_key_in_progress: a request with this key is still running. Retry-After gives the wait."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    IdempotencyKeyReused:
      description: "idempotency_key_reused: this key was already used for a different request."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    RateLimited:
      description: "rate_limited: too many requests from this address or account. Retry-After gives the wait in seconds."
      headers:
        Retry-After:
          schema:
            type: "integer"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    Tokens:
      description: "Token pair. Sent with Cache-Control: no-store."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/TokenResponse"
    Unauthorized:
      description: "Missing or invalid bearer token. WWW-Authenticate describes the challenge."
      headers:
        WWW-Authenticate:
          schema:
            type: "string"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    ProfileRequired:
      description: "Authenticated, but the identity has no profile yet. Create one with POST /api/v1/users."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    ServiceUnavailable:
      description: "The authentication provider could not verify the token (auth_unavailable), or the server is at its concurrent-request limit (overloaded, with Retry-After)."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
  schemas:
    Credentials:
      type: "object"
      additionalProperties: false
      required:
        - "email"
        - "password"
      properties:
        email:
          type: "string"
          maxLength: 254
          description: "Plain address; case-insensitive"
        password:
          type: "string"
          minLength: 12
          maxLength: 128
    RefreshRequest:
      type: "object"
      additionalProperties: false
      required:
        - "refresh_token"
      properties:
        refresh_token:
          type: "string"
    TokenResponse:
      type: "object"
      additionalProperties: false
      required:
        - "access_token"
        - "token_type"
        - "expires_in"
        - "refresh_token"
      properties:
        access_token:
          type: "string"
          description: "EdDSA-signed JWT"
        token_type:
          type: "string"
          enum:
            - "Bearer"
        expires_in:
          type: "integer"
          description: "Access token lifetime in seconds"
        refresh_token:
          type: "string"
          description: "Opaque, single use"
    Set:
      type: "object"
      additionalProperties: false
      required:
        - "repetitions"
        - "weight_kg"
      properties:
        repetitions:
          type: "integer"
          minimum: 1
          maximum: 1000
        weight_kg:
          type: "number"
          minimum: 0
          maximum: 2000
    ExerciseInput:
      type: "object"
      additionalProperties: false
      required:
        - "name"
        - "kind"
      properties:
        name:
          type: "string"
          maxLength: 200
          minLength: 1
        kind:
          type: "string"
          enum:
            - "strength"
            - "cardio"
        sets:
          type: "array"
          items:
            "$ref": "#/components/schemas/Set"
          maxItems: 100
          nullable: true
        minutes:
          type: "number"
          exclusiveMinimum: true
          minimum: 0
          maximum: 1440
          nullable: true
        avg_bpm:
          type: "integer"
          minimum: 1
          maximum: 300
          nullable: true
