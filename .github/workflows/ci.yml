name: CI
on:
  workflow_dispatch: # manual
    
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: latihan_test
          POSTGRES_USER: latihan
          POSTGRES_PASSWORD: latihan
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U latihan -d latihan_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://latihan:latihan@localhost:5432/latihan_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - run: go mod download
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test -race -count=1 -tags=integration ./...
      - run: go build ./...
      - run: docker compose config --quiet
      - run: docker build -t latihan-api:ci .
