services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: latihan
      POSTGRES_USER: latihan
      POSTGRES_PASSWORD: latihan
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U latihan -d latihan"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "postgres://latihan:latihan@postgres:5432/latihan?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot job: creates the jwt provider's signing key on first start and
  # leaves it alone afterwards. Harmless when another AUTH_PROVIDER is used.
  jwt-keys:
    build: .
    image: latihan-api:local
    command: ["keygen", "-out", "/keys/signing.pem"]
    volumes:
      - jwt-keys:/keys
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  latihan-api:
    build: .
    image: latihan-api:local
    # AUTH_* settings come from .env; the values below override the rest for Compose.
    env_file:
      - path: .env
        required: false
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://latihan:latihan@postgres:5432/latihan?sslmode=disable"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      AUTH_JWT_KEY_FILE: "/keys/signing.pem"
    volumes:
      - jwt-keys:/keys:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      jwt-keys:
        condition: service_completed_successfully
    stop_grace_period: 15s
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Optional: docker compose --profile observability up
  # Prometheus UI on http://localhost:9091, Jaeger UI on http://localhost:16686.
  # Set OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 in .env to send traces.
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [observability]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9091:9090"

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    profiles: [observability]
    ports:
      - "127.0.0.1:16686:16686"

volumes:
  postgres-data:
  jwt-keys:
