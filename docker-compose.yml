services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: latihan
      POSTGRES_USER: latihan
      POSTGRES_PASSWORD: latihan
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U latihan -d latihan"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "postgres://latihan:latihan@postgres:5432/latihan?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  latihan-api:
    build: .
    # AUTH_* settings come from .env; the values below override the rest for Compose.
    env_file:
      - path: .env
        required: false
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://latihan:latihan@postgres:5432/latihan?sslmode=disable"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 15s
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  postgres-data:
