# Production overlay: HTTPS at the edge, signed images, nothing else reachable.
#
# Deployments normally go through deploy/deploy.sh, which verifies the image
# signature first (see docs/DEPLOY.md). By hand:
#
#   scripts/init-secrets.sh                  # once: random credentials in ./secrets
#   # .env: SECRETS_DIR=./secrets, DOMAIN=api.example.com, ACME_EMAIL=you@example.com,
#   #       AUTH_JWT_ISSUER=https://api.example.com (with AUTH_PROVIDER=jwt)
#   LATIHAN_IMAGE=ghcr.io/perdhevi/latihanapi@sha256:... \
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --wait
#
# Caddy obtains and renews certificates for DOMAIN automatically (the domain's
# DNS must point at this machine, with ports 80 and 443 open). Only Caddy
# publishes ports; the API and PostgreSQL are reachable only on the Compose
# network.

# Rotate container logs so they cannot fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      default:
        # Fixed, so the API can trust exactly this address for X-Forwarded-For.
        ipv4_address: 172.30.0.10
    depends_on:
      latihan-api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 200
    logging: *logging

  # Production never builds: it runs the signed image named by LATIHAN_IMAGE,
  # pinned by digest.
  jwt-keys:
    build: !reset null
    image: ${LATIHAN_IMAGE:?set LATIHAN_IMAGE to a signed image digest}
    logging: *logging

  latihan-api:
    build: !reset null
    image: ${LATIHAN_IMAGE:?set LATIHAN_IMAGE to a signed image digest}
    ports: !reset []
    environment:
      TRUSTED_PROXIES: 172.30.0.10
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    logging: *logging

  backup:
    profiles: !reset []
    environment:
      BACKUP_AGE_RECIPIENT: "${BACKUP_AGE_RECIPIENT:?production requires encrypted backups; set BACKUP_AGE_RECIPIENT}"
    restart: unless-stopped
    logging: *logging

  migrate:
    logging: *logging

  postgres:
    ports: !reset []
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 300
    logging: *logging

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  caddy-data:
  caddy-config:
